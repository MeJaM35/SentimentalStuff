version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    container_name: sentiment_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      # Prevents the local .venv from overriding the container's python environment
      - /app/.venv
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
    container_name: sentiment_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      # Prevents local node_modules from breaking the container build
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    restart: unless-stopped
