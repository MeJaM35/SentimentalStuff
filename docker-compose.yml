version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    container_name: sentiment_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      # Prevents the local .venv from overriding the container's python environment
      - /app/.venv
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
    container_name: sentiment_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      # Prevents local node_modules from breaking the container build
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: sentiment_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - ./workflow:/workflows
    restart: unless-stopped
